name: aivis-workbench-prototype

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    image: aivis-backend:local
    init: true
    ports:
      - "${AIVIS_BACKEND_HOST_PORT:-8080}:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/apps/workbench/Dockerfile
    cap_drop:
      - ALL
    image: aivis-workbench:local
    init: true
    environment:
      AIVIS_BACKEND_ORIGIN: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3200"
    ports:
      - "${AIVIS_WORKBENCH_HOST_PORT:-3200}:3200"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/evidence-workbench').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
