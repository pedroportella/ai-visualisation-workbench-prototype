[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aivis-backend"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for the AI Visualisation Workbench prototype."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0",
  "uvicorn[standard]>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
