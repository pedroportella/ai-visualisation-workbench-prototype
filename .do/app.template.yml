# DigitalOcean App Platform template for the short-lived AIVIS review environment.
# The workbench is public; the deterministic fixture API is private to this app.

name: aivis-evidence-workbench-review
region: syd

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - component:
        name: workbench
      match:
        path:
          prefix: /

services:
  - name: backend
    git:
      repo_clone_url: https://github.com/pedroportella/ai-visualisation-workbench-prototype.git
      branch: main
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    internal_ports:
      - 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health/ready
      port: 8000
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: AIVIS_BACKEND_HOST
        value: 0.0.0.0
        scope: RUN_TIME
        type: GENERAL
      - key: AIVIS_BACKEND_PORT
        value: "8000"
        scope: RUN_TIME
        type: GENERAL

  - name: workbench
    git:
      repo_clone_url: https://github.com/pedroportella/ai-visualisation-workbench-prototype.git
      branch: main
    source_dir: /
    dockerfile_path: frontend/apps/workbench/Dockerfile
    http_port: 3200
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /evidence-workbench
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: HOSTNAME
        value: 0.0.0.0
        scope: RUN_TIME
        type: GENERAL
      - key: PORT
        value: "3200"
        scope: RUN_TIME
        type: GENERAL
      - key: AIVIS_FRONTEND_DATA_SOURCE
        value: backend
        scope: RUN_TIME
        type: GENERAL
      - key: AIVIS_BACKEND_ORIGIN
        value: "${backend.PRIVATE_URL}"
        scope: RUN_TIME
        type: GENERAL
